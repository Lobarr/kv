version: '3'

tasks:
  # ------------------------------------------------------------------
  # Development
  # ------------------------------------------------------------------
  run:
    desc: Start gRPC and metrics servers for development (go run)
    cmds:
      - go run main.go

  build:
    desc: Build server binary
    cmds:
      - go build -o ./bin/kv

  # ------------------------------------------------------------------
  # Benchmarks (Docker)
  # ------------------------------------------------------------------
  bench:grpc:
    desc: Run gRPC benchmark (Docker)
    aliases: [bench]
    cmds:
      - docker compose up --build -d kv-server
      - docker compose run --rm benchmark-grpc
      - docker compose down

  bench:experiment:
    desc: Run direct & gRPC engine experiments
    cmds:
      - go build -o bin/benchmark benchmark/benchmark.go
      - ./bin/benchmark --mode=experiment

  # ------------------------------------------------------------------
  # Quality Assurance
  # ------------------------------------------------------------------
  test:
    desc: Run tests
    cmds:
      - go test ./core -v -timeout 1h

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test ./core -race -v -timeout 1h

  lint:
    desc: Check code formatting
    cmds:
      - gofmt -d .

  fmt:
    desc: Fix code formatting
    aliases: [lint:fix]
    cmds:
      - gofmt -d -w .

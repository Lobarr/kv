name: CI

on:
  push:
  pull_request:

permissions:
  packages: write
  contents: read
  id-token: write

env:
  IMAGE_NAME: ghcr.io/lobarr/kv:${{ github.sha }}
  IMAGE_NAME_ARM: ghcr.io/lobarr/kv-arm:${{ github.sha }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet & Test storage engine
        run: |
          go vet ./...
          go test -race -v ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push x86 Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push ARM Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.arm
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ env.IMAGE_NAME_ARM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

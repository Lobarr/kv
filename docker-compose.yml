services:
  kv-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["-data-path=/data"]
    stop_grace_period: 15s
    ports:
      - "8081:8081"
      - "9999:9999"
    networks:
      - kv-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 1s
      timeout: 1s
      retries: 10

  benchmark-grpc:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    depends_on:
      kv-server:
        condition: service_healthy
    command: ["--mode=grpc", "--grpc-addr=kv-server:8081", "--num-requests=1000000", "--concurrency=500", "--batch-size=100"]
    networks:
      - kv-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    networks:
      - kv-network

networks:
  kv-network:
    driver: bridge

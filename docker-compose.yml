services:
  kv-server-fiber:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["-http-server-type=fiber", "-data-path=/data"]
    stop_grace_period: 15s
    ports:
      - "8888:8080"
      - "8081:8081"
    networks:
      - kv-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 1s
      timeout: 1s
      retries: 10

  kv-server-std:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["-http-server-type=std", "-data-path=/data"]
    stop_grace_period: 15s
    ports:
      - "8889:8080"
      - "8083:8081"
    networks:
      - kv-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 1s
      timeout: 1s
      retries: 10

  benchmark-http-fiber:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    depends_on:
      kv-server-fiber:
        condition: service_healthy
    command: ["--mode=http", "--base-url=http://kv-server-fiber:8080", "--num-requests=1000000", "--concurrency=500", "--batch-size=100"]
    networks:
      - kv-network

  benchmark-http-std:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    depends_on:
      kv-server-std:
        condition: service_healthy
    command: ["--mode=http", "--base-url=http://kv-server-std:8080", "--num-requests=1000000", "--concurrency=500", "--batch-size=100"]
    networks:
      - kv-network

  benchmark-grpc:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    depends_on:
      kv-server-fiber:
        condition: service_healthy
    command: ["--mode=grpc", "--grpc-addr=kv-server-fiber:8081", "--num-requests=1000000", "--concurrency=500", "--batch-size=100"]
    networks:
      - kv-network

networks:
  kv-network:
    driver: bridge
